<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Daftar Produk</h2>
  <p>Jumlah produk: {{ products.length }}</p>
  <ion-list>
    <ion-item *ngFor="let product of products">
      <ion-label>
        <h2>{{ product.name }}</h2>
        <p>Kategori: {{ product.category }}</p>
        <p>Harga jual: Rp {{ product.sellingPrice }}</p>
        <p>Stok: {{ product.stock }}</p>
        <p *ngIf="product.stock == 0" class="stock-empty">Stok habis</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
