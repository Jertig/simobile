<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/products"></ion-back-button>
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Detail Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="product != null">
    <ion-img id="product-image" [src]="getImageUrl()" alt="Gambar produk"></ion-img>
    <h2>{{ product.name }}</h2>
    <ion-button fill="outline" routerLink="/product-form/{{ product.id }}">Edit produk</ion-button>
    <ion-list>
      <ion-item>
        <ion-label>Kategori: {{ product.category }}</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Stok: {{ product.stock }}</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Harga beli: Rp {{ product.purchasePrice }}</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Harga jual: Rp {{ product.sellingPrice }}</ion-label>
      </ion-item>
    </ion-list>
    <ion-button expand="block" [disabled]="product.stock == 0" (click)="addToCart()">
      Tambah ke keranjang
    </ion-button>
    <p *ngIf="cartMessage != ''">{{ cartMessage }}</p>
    <ion-button expand="block" fill="outline" routerLink="/cart">Lihat keranjang</ion-button>
  </div>
  <p *ngIf="product == null">Produk tidak ditemukan.</p>
</ion-content>
