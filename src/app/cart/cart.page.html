<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/products"></ion-back-button>
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Keranjang</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p *ngIf="getItems().length == 0">Keranjang masih kosong.</p>
  <ion-list>
    <ion-item *ngFor="let item of getItems()">
      <ion-label>
        <h2>{{ item.name }}</h2>
        <p>{{ item.quantity }} x Rp {{ item.price }}</p>
        <p>Subtotal: Rp {{ item.quantity * item.price }}</p>
      </ion-label>
      <ion-button slot="end" color="danger" (click)="removeProduct(item.productId)">Hapus</ion-button>
    </ion-item>
  </ion-list>
  <h2>Total: Rp {{ getTotal() }}</h2>
  <ion-button expand="block" routerLink="/tabs/products">Pilih produk</ion-button>
</ion-content>
